name: Build MA Cyber Shield APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project archive
        run: test -f agon-agent_fixed.zip

      - name: Extract project
        run: unzip -q agon-agent_fixed.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: project
        run: npm ci

      - name: TypeScript check
        working-directory: project
        run: npx tsc --noEmit

      - name: Generate Android project
        working-directory: project
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: project/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-cyber-shield-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
