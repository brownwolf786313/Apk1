name: Build MA Cyber Shield APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify MA Cyber project ZIP
        run: |
          test -f 'ma cyber .zip'
          echo "Project ZIP found"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q 'ma cyber .zip' -d project

      - name: Locate project package.json
        run: |
          echo "Searching for package.json..."
          find project -maxdepth 3 -name package.json -print

      - name: Move project to expected location
        run: |
          if [ -f "project/package.json" ]; then
            echo "Project is already at project/"
          elif [ -f "project/agon-agent_fixed/package.json" ]; then
            shopt -s dotglob
            mv project/agon-agent_fixed/* project/
            rm -rf project/agon-agent_fixed
          elif [ -f "project/agon-agent/package.json" ]; then
            shopt -s dotglob
            mv project/agon-agent/* project/
            rm -rf project/agon-agent
          else
            echo "ERROR: package.json was not found in the extracted ZIP"
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show project information
        working-directory: project
        run: |
          node --version
          npm --version
          echo "Project files:"
          ls -la

      - name: Install dependencies
        working-directory: project
        run: npm ci

      - name: TypeScript check
        working-directory: project
        run: npx tsc --noEmit

      - name: Generate Android project
        working-directory: project
        run: npx expo prebuild --platform android --clean

      - name: Build installable debug APK
        working-directory: project/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

      - name: Verify APK
        run: |
          test -f project/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-cyber-shield-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
